server {
    listen 80;
    listen [::]:80;
    server_name host-0002.ephemio.com;
    location /.well-known/acme-challenge/ { root /var/lib/ephemio-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name host-0002.ephemio.com;
    ssl_certificate /etc/letsencrypt/live/host-0002.ephemio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/host-0002.ephemio.com/privkey.pem;
    client_max_body_size 50m;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Streaming is authorized by the gateway; no cache or response rewriting.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
